name: vulnerable-ci

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read

jobs:
  authorize:
    environment:
      ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: true

  build:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: checkout fork code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: run local action from fork
        uses: "./.github/actions/step_merge_main"

      - name: access secret
        env:
          DUMMY_SECRET: ${{ secrets.DUMMY_AZURE_SECRET }}
        run: echo "Secret in scope - proof of access"
